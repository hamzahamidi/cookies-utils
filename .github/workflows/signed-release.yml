name: Signed release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to sign
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  sign:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/release.yml')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve stable release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          stable_tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="$INPUT_TAG"
            if [[ ! "$tag" =~ $stable_tag ]]; then
              echo "Input must be a stable vX.Y.Z tag" >&2
              exit 1
            fi
          else
            if [[ ! "$UPSTREAM_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release workflow run has an invalid commit SHA" >&2
              exit 1
            fi
            mapfile -t tags < <(git tag --points-at "$UPSTREAM_HEAD_SHA" | grep -E "$stable_tag" || true)
            if (( ${#tags[@]} == 0 )); then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No stable release tag points at $UPSTREAM_HEAD_SHA"
              exit 0
            fi
            if (( ${#tags[@]} != 1 )); then
              echo "Expected one stable release tag at $UPSTREAM_HEAD_SHA, found ${#tags[@]}" >&2
              exit 1
            fi
            tag="${tags[0]}"
          fi

          tag_commit="$(git rev-parse --verify "${tag}^{commit}")"
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            if [[ "$tag_commit" != "$UPSTREAM_HEAD_SHA" ]]; then
              echo "Release tag does not point to the completed Release workflow commit" >&2
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$tag_commit" main; then
            echo "Manual backfill tag is not reachable from main" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download and verify the npm package
        if: steps.release.outputs.skip != 'true'
        id: npm
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TAG_COMMIT: ${{ steps.release.outputs.commit }}
          GH_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/release-assets
        run: |
          mkdir -p "$OUTPUT_DIR"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const tag = process.env.TAG;
          const tagCommit = process.env.TAG_COMMIT;
          const repository = process.env.GH_REPOSITORY;
          const version = tag.slice(1);
          const assetName = `cookies-utils-${version}.tgz`;
          const metadataResponse = await fetch(`https://registry.npmjs.org/cookies-utils/${version}`);
          if (!metadataResponse.ok || new URL(metadataResponse.url).origin !== 'https://registry.npmjs.org') {
            throw new Error(`npm metadata request failed or redirected outside registry.npmjs.org: ${metadataResponse.status}`);
          }

          const metadata = await metadataResponse.json();
          if (metadata.name !== 'cookies-utils' || metadata.version !== version) {
            throw new Error('npm metadata name or version did not match the release tag');
          }
          if (!/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(metadata.dist?.integrity ?? '')) {
            throw new Error('npm metadata did not contain a SHA-512 integrity value');
          }

          const tarballUrl = new URL(metadata.dist.tarball);
          const expectedPath = `/cookies-utils/-/${assetName}`;
          if (tarballUrl.protocol !== 'https:' || tarballUrl.hostname !== 'registry.npmjs.org' || tarballUrl.pathname !== expectedPath) {
            throw new Error('npm metadata returned an unexpected tarball URL');
          }

          const tarballResponse = await fetch(tarballUrl);
          if (!tarballResponse.ok || new URL(tarballResponse.url).origin !== 'https://registry.npmjs.org') {
            throw new Error(`npm tarball request failed or redirected outside registry.npmjs.org: ${tarballResponse.status}`);
          }
          const bytes = Buffer.from(await tarballResponse.arrayBuffer());
          const actualIntegrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
          if (actualIntegrity !== metadata.dist.integrity) {
            throw new Error('downloaded npm tarball did not match registry dist.integrity');
          }

          const attestationsUrl = new URL(metadata.dist.attestations?.url ?? '');
          const expectedAttestationsPath = `/-/npm/v1/attestations/cookies-utils@${version}`;
          if (attestationsUrl.protocol !== 'https:' || attestationsUrl.hostname !== 'registry.npmjs.org' || attestationsUrl.pathname !== expectedAttestationsPath) {
            throw new Error('npm metadata returned an unexpected attestations URL');
          }
          const attestationsResponse = await fetch(attestationsUrl);
          if (!attestationsResponse.ok || new URL(attestationsResponse.url).origin !== 'https://registry.npmjs.org') {
            throw new Error(`npm attestations request failed or redirected outside registry.npmjs.org: ${attestationsResponse.status}`);
          }
          const attestationsDocument = await attestationsResponse.json();
          const slsaPredicateType = 'https://slsa.dev/provenance/v1';
          const slsaAttestations = attestationsDocument.attestations?.filter((item) => item.predicateType === slsaPredicateType) ?? [];
          if (slsaAttestations.length !== 1) {
            throw new Error(`expected one npm SLSA provenance bundle, found ${slsaAttestations.length}`);
          }

          const provenanceBundle = slsaAttestations[0].bundle;
          const envelope = provenanceBundle?.dsseEnvelope;
          if (!['application/vnd.dev.sigstore.bundle.v0.2+json', 'application/vnd.dev.sigstore.bundle.v0.3+json'].includes(provenanceBundle?.mediaType) || envelope?.payloadType !== 'application/vnd.in-toto+json' || envelope.signatures?.length !== 1) {
            throw new Error('npm SLSA provenance is not a signed Sigstore DSSE bundle');
          }
          const statement = JSON.parse(Buffer.from(envelope.payload, 'base64').toString('utf8'));
          const expectedDigest = Buffer.from(metadata.dist.integrity.slice('sha512-'.length), 'base64').toString('hex');
          const expectedSubject = `pkg:npm/cookies-utils@${version}`;
          if (statement._type !== 'https://in-toto.io/Statement/v1' || statement.predicateType !== slsaPredicateType || statement.subject?.length !== 1 || statement.subject[0].name !== expectedSubject || statement.subject[0].digest?.sha512 !== expectedDigest) {
            throw new Error('npm SLSA provenance does not describe the exact published package tarball');
          }

          const workflow = statement.predicate?.buildDefinition?.externalParameters?.workflow;
          if (workflow?.repository !== `https://github.com/${repository}` || workflow.ref !== 'refs/heads/main' || workflow.path !== '.github/workflows/release.yml') {
            throw new Error('npm SLSA provenance does not identify the expected release workflow on main');
          }
          const predicate = statement.predicate;
          if (predicate?.buildDefinition?.buildType !== 'https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1' || predicate.runDetails?.builder?.id !== 'https://github.com/actions/runner/github-hosted') {
            throw new Error('npm SLSA provenance does not identify the expected GitHub Actions builder');
          }
          const sourceMatches = predicate.buildDefinition.resolvedDependencies?.filter((dependency) => dependency.digest?.gitCommit === tagCommit && dependency.uri?.startsWith(`git+https://github.com/${repository}@`)) ?? [];
          if (sourceMatches.length !== 1) {
            throw new Error('npm SLSA provenance source commit does not match the release tag');
          }

          await writeFile(join(process.env.OUTPUT_DIR, assetName), bytes, { flag: 'wx' });
          const bundleName = `${assetName}.sigstore.json`;
          const provenanceName = `${assetName}.intoto.jsonl`;
          await writeFile(join(process.env.OUTPUT_DIR, provenanceName), `${JSON.stringify(provenanceBundle)}\n`, { flag: 'wx' });
          await writeFile(process.env.GITHUB_OUTPUT, `tarball=${assetName}\nbundle=${bundleName}\nprovenance=${provenanceName}\nintegrity=${metadata.dist.integrity}\n`, { flag: 'a' });
          NODE
      - name: Check existing release assets
        if: steps.release.outputs.skip != 'true'
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          TARBALL: ${{ steps.npm.outputs.tarball }}
          BUNDLE: ${{ steps.npm.outputs.bundle }}
          PROVENANCE: ${{ steps.npm.outputs.provenance }}
        run: |
          set -euo pipefail

          release="$(gh api "repos/$GH_REPOSITORY/releases/tags/$TAG")"
          if [[ "$(jq -r '.draft or .prerelease' <<< "$release")" == 'true' ]]; then
            echo "GitHub release must be published and stable" >&2
            exit 1
          fi

          names="$(jq -r '.assets[].name' <<< "$release")"
          has_tarball=false
          has_bundle=false
          has_provenance=false
          if grep -Fxq "$TARBALL" <<< "$names"; then has_tarball=true; fi
          if grep -Fxq "$BUNDLE" <<< "$names"; then has_bundle=true; fi
          if grep -Fxq "$PROVENANCE" <<< "$names"; then has_provenance=true; fi

          if [[ "$has_tarball" == true && "$has_bundle" == true && "$has_provenance" == true ]]; then
            echo "state=complete" >> "$GITHUB_OUTPUT"
          elif [[ "$has_tarball" == false && "$has_bundle" == false && "$has_provenance" == false ]]; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
          elif [[ "$has_tarball" == true && "$has_bundle" == true && "$has_provenance" == false ]]; then
            echo "state=missing-provenance" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub release has an unexpected partial asset set; refusing to replace or repair it automatically" >&2
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.release.outputs.skip != 'true'
        with:
          cosign-release: v3.1.3
      - name: Verify npm SLSA provenance
        if: steps.release.outputs.skip != 'true'
        env:
          PROVENANCE: ${{ steps.npm.outputs.provenance }}
          TARBALL: ${{ steps.npm.outputs.tarball }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          cosign verify-blob-attestation \
            --type 'https://slsa.dev/provenance/v1' \
            --bundle "$ASSET_DIR/$PROVENANCE" \
            --certificate-identity 'https://github.com/hamzahamidi/cookies-utils/.github/workflows/release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$ASSET_DIR/$TARBALL"
      - name: Verify existing release assets
        if: steps.assets.outputs.state == 'complete' || steps.assets.outputs.state == 'missing-provenance'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          TARBALL: ${{ steps.npm.outputs.tarball }}
          BUNDLE: ${{ steps.npm.outputs.bundle }}
          PROVENANCE: ${{ steps.npm.outputs.provenance }}
          STATE: ${{ steps.assets.outputs.state }}
          EXPECTED_INTEGRITY: ${{ steps.npm.outputs.integrity }}
          EXPECTED_PROVENANCE_PATH: ${{ runner.temp }}/release-assets/${{ steps.npm.outputs.provenance }}
          ASSET_DIR: ${{ runner.temp }}/existing-assets
        run: |
          set -euo pipefail
          mkdir -p "$ASSET_DIR"
          download_patterns=(--pattern "$TARBALL" --pattern "$BUNDLE")
          if [[ "$STATE" == 'complete' ]]; then download_patterns+=(--pattern "$PROVENANCE"); fi
          gh release download "$TAG" --repo "$GH_REPOSITORY" --dir "$ASSET_DIR" "${download_patterns[@]}"
          node --input-type=module - "$ASSET_DIR/$TARBALL" "$EXPECTED_INTEGRITY" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';

          const [path, expected] = process.argv.slice(2);
          const actual = `sha512-${createHash('sha512').update(await readFile(path)).digest('base64')}`;
          if (actual !== expected) throw new Error('existing GitHub release tarball does not match npm dist.integrity');
          NODE
          cosign verify-blob \
            --bundle "$ASSET_DIR/$BUNDLE" \
            --certificate-identity 'https://github.com/hamzahamidi/cookies-utils/.github/workflows/signed-release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$ASSET_DIR/$TARBALL"
          if [[ "$STATE" == 'complete' ]]; then
            node --input-type=module - "$ASSET_DIR/$PROVENANCE" "$EXPECTED_PROVENANCE_PATH" <<'NODE'
            import assert from 'node:assert/strict';
            import { readFile } from 'node:fs/promises';

            const [actualPath, expectedPath] = process.argv.slice(2);
            assert.deepStrictEqual(JSON.parse(await readFile(actualPath, 'utf8')), JSON.parse(await readFile(expectedPath, 'utf8')));
            NODE
            cosign verify-blob-attestation \
              --type 'https://slsa.dev/provenance/v1' \
              --bundle "$ASSET_DIR/$PROVENANCE" \
              --certificate-identity 'https://github.com/hamzahamidi/cookies-utils/.github/workflows/release.yml@refs/heads/main' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$ASSET_DIR/$TARBALL"
          fi
      - name: Sign npm package and upload release assets
        if: steps.assets.outputs.state == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          TARBALL: ${{ steps.npm.outputs.tarball }}
          BUNDLE: ${{ steps.npm.outputs.bundle }}
          PROVENANCE: ${{ steps.npm.outputs.provenance }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          tarball="$ASSET_DIR/$TARBALL"
          bundle="$ASSET_DIR/$BUNDLE"
          provenance="$ASSET_DIR/$PROVENANCE"
          cosign sign-blob --yes --bundle "$bundle" "$tarball"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity 'https://github.com/hamzahamidi/cookies-utils/.github/workflows/signed-release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$tarball"
          gh release upload "$TAG" "$tarball" "$bundle" "$provenance" --repo "$GH_REPOSITORY"
      - name: Add npm provenance to the existing release
        if: steps.assets.outputs.state == 'missing-provenance'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          PROVENANCE: ${{ steps.npm.outputs.provenance }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: gh release upload "$TAG" "$ASSET_DIR/$PROVENANCE" --repo "$GH_REPOSITORY"
