name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Report every leg. With the default fail-fast, one leg failing cancels
      # the others mid-step, which reads as a second failure and hides whether
      # the remaining versions are actually healthy.
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run coverage
      - run: npm run smoke
      - name: Upload coverage
        # Forked pull requests receive no secrets, so CODECOV_TOKEN is absent
        # and the upload would fail every outside contribution. A push event
        # has no pull_request context at all, so the fork check treats a
        # missing value as "not a fork" rather than skipping main too.
        if: matrix.node-version == '22.x' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
