name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Report every leg. With the default fail-fast, one leg failing cancels
      # the others mid-step, which reads as a second failure and hides whether
      # the remaining versions are actually healthy.
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - if: matrix.node-version == '22.x'
        run: npm run check:bundle
      - run: npm run coverage
      - run: npm run smoke
      - name: Upload coverage
        # Forked pull requests receive no secrets, so CODECOV_TOKEN is absent
        # and the upload would fail every outside contribution. A push event
        # has no pull_request context at all, so the fork check treats a
        # missing value as "not a fork" rather than skipping main too.
        # Dependabot pull requests also run without repository secrets.
        if: >-
          matrix.node-version == '22.x' &&
          github.event.pull_request.head.repo.fork != true &&
          github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
