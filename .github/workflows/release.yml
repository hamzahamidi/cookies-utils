name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Node 22 ships npm 10, and Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # .releaserc.json restricts releases to the main branch, so on a pull
      # request semantic-release stops at that branch check and exits before
      # it ever reaches npm authentication. This step catches configuration
      # and plugin errors only. It does not prove that OIDC publishing works.
      - name: Dry run
        if: github.event_name == 'pull_request'
        run: npx semantic-release --dry-run
      - name: Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
